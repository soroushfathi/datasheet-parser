[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasheet-parser"
version = "0.1.0"
description = "Evidence-backed, target-aware datasheet extraction with a resumable CLI"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "pymongo>=4.10,<5", "typer>=0.15,<1",
  "rich>=13,<15", "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6",
  "Pillow>=11,<13", "jsonschema>=4.23,<5", "python-dotenv>=1,<2",
  "openai>=2,<3", "langgraph>=1,<2", "tiktoken>=0.11,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
docling = ["docling>=2,<3"]
retrieval = ["sentence-transformers>=5,<6"]

[project.scripts]
datasheet = "datasheet_parser.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/datasheet_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
